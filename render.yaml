services:
  - type: web
    name: clemson-offense
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/seasons
    envVars:
      - key: NODE_ENV
        value: production
      - key: CFBD_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: clemson-offense-db
          property: connectionString

databases:
  - name: clemson-offense-db
    plan: free
    databaseName: clemson_offense
    user: clemson
